[supervisord]
nodaemon=true
logfile=/var/log/crm-supervisord.log
pidfile=/run/crm-supervisord.pid

[unix_http_server]
file=/run/crm-supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/crm-supervisor.sock

[program:api]
directory=/app/crm/apps/api
command=/usr/local/bin/bun src/main.ts
environment=NODE_ENV="production",PORT="3001"
autorestart=true
stdout_logfile=/var/log/crm-api.log
stderr_logfile=/var/log/crm-api-error.log
stopasgroup=true
killasgroup=true

[program:web]
directory=/app/crm/apps/app
command=/usr/local/bin/bun run start --hostname 0.0.0.0 --port 3000
environment=NODE_ENV="production"
autorestart=true
stdout_logfile=/var/log/crm-web.log
stderr_logfile=/var/log/crm-web-error.log
stopasgroup=true
killasgroup=true

[program:sync]
directory=/app/crm/apps/sync
command=/usr/local/bin/bun src/worker.ts
environment=NODE_ENV="production"
autorestart=true
stdout_logfile=/var/log/crm-sync.log
stderr_logfile=/var/log/crm-sync-error.log
stopasgroup=true
killasgroup=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/var/log/crm-nginx.log
stderr_logfile=/var/log/crm-nginx-error.log
